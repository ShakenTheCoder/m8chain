[project]
name = "n8chain-organ"
version = "0.1.0"
description = "TikTok organ extraction with Apify, Whisper and Laya"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "apify-client>=2,<3",
  "faster-whisper>=1.2,<2",
  # PyAV 19 removed metadata_errors, still used by faster-whisper 1.2.1.
  "av>=14,<17",
  "laya==0.4.28",
  "python-dotenv>=1,<2",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "torch>=2.4,<3",
  "transformers>=5.22,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
